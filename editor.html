<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>nothing-agent config</title>
<style>
  :root { --bg: #f6f6f4; --fg: #141414; --muted: #6b6b6b; --line: #d9d9d4; --card: #ffffff; --accent: #d71921; --ok: #1f7a3a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e0e0e; --fg: #ededed; --muted: #9a9a9a; --line: #2a2a2a; --card: #171717; --accent: #ff3b42; --ok: #4cc06d; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; } /* else the flex rules below would show hidden parts */
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans SC", sans-serif; }
  body { display: flex; flex-direction: column; }
  header { padding: 16px 16px 8px; display: flex; align-items: baseline; gap: 10px; }
  h1 { font-size: 18px; margin: 0; letter-spacing: .02em; }
  h1 span { color: var(--accent); }
  #dirty { font-size: 13px; color: var(--accent); visibility: hidden; }
  main { flex: 1; display: flex; flex-direction: column; padding: 0 16px; gap: 10px; min-height: 0; }
  select, input, textarea, button { font: inherit; color: var(--fg); }
  select, input { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
  textarea { flex: 1; min-height: 240px; width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 15px; line-height: 1.5;
    resize: none; white-space: pre-wrap; overflow-wrap: anywhere; overflow: auto; } /* wrap: phone is narrow */
  .hint { font-size: 13px; color: var(--muted); margin: 0; }
  footer { position: sticky; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: var(--bg); border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
  button { padding: 14px 18px; border: 0; border-radius: 12px; font-weight: 600; cursor: pointer; }
  #save { flex: 1; background: var(--accent); color: #fff; }
  #save:disabled { opacity: .45; }
  #reload { background: var(--card); border: 1px solid var(--line); }
  #status { font-size: 14px; min-height: 1.4em; padding: 0 16px; color: var(--muted); }
  #status.ok { color: var(--ok); } #status.err { color: var(--accent); }
  #login { display: none; padding: 0 16px; gap: 10px; flex-direction: column; }
  #pause { width: 100%; padding: 18px; font-size: 18px; background: var(--accent); color: #fff; }
  #pause.on { background: var(--ok); }
  #pause-hint { font-weight: 600; }
  #listen { width: 100%; padding: 18px; font-size: 18px; background: var(--card); border: 1px solid var(--line); }
  #listen.on { background: var(--fg); color: var(--bg); }
  #meter { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
  #level { height: 100%; width: 0; background: var(--muted); transition: width .06s linear; }
  #level.on { background: var(--ok); } /* green while an utterance is being captured */
  #heard { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px;
    max-height: 40vh; overflow: auto; font-size: 14px; }
  #heard li { padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
  #heard .meta { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<header><h1><span>●</span> nothing-agent</h1><span id="dirty">unsaved</span></header>

<section id="login">
  <p class="hint">Enter the BRAIN_TOKEN set on the PC. It stays on this phone only.</p>
  <input id="token" type="password" autocomplete="off" placeholder="BRAIN_TOKEN">
  <button id="go" style="background:var(--accent);color:#fff">Unlock</button>
</section>

<main id="app" hidden>
  <button id="pause">…</button>
  <p class="hint" id="pause-hint"></p>
  <button id="listen">🎙 Start listening</button>
  <div id="meter" aria-hidden="true"><div id="level"></div></div>
  <ul id="heard" aria-live="polite"></ul>
  <select id="file" aria-label="Config file"></select>
  <textarea id="text" spellcheck="false" autocapitalize="off" autocorrect="off" aria-label="File contents"></textarea>
  <p class="hint">places.txt: one per line, <code>name = lat,lng</code> or <code>name = Waze search text</code>. Lines starting with # are notes.</p>
</main>
<div id="status" role="status"></div>
<footer id="bar" hidden><button id="reload">Reload</button><button id="save" disabled>Save</button></footer>

<script>
const $ = (id) => document.getElementById(id);
let token = "", loaded = "";
try { token = localStorage.getItem("brain_token") || ""; } catch {}

function status(msg, kind = "") { $("status").textContent = msg; $("status").className = kind; }
function set_dirty() {
  const dirty = $("text").value !== loaded;
  $("dirty").style.visibility = dirty ? "visible" : "hidden";
  $("save").disabled = !dirty;
}

async function call(path, opts = {}) {
  const res = await fetch(path, { ...opts, headers: { "x-token": token, ...(opts.headers || {}) } });
  if (res.status === 401) { show_login("Wrong token."); throw new Error("bad token"); }
  if (!res.ok) throw new Error(await res.text() || res.status);
  return res;
}

function show_login(msg) {
  try { localStorage.removeItem("brain_token"); } catch {}
  $("login").style.display = "flex"; $("app").hidden = true; $("bar").hidden = true;
  status(msg || "", msg ? "err" : "");
}

async function load_file() {
  status("Loading…");
  loaded = await (await call("/file?name=" + encodeURIComponent($("file").value))).text();
  $("text").value = loaded; set_dirty(); status("Loaded " + $("file").value);
}

function show_pause(paused) {
  $("pause").textContent = paused ? "▶ Resume phone actions" : "⏸ Pause phone actions";
  $("pause").classList.toggle("on", paused);
  $("pause").dataset.paused = paused ? "1" : "";
  $("pause-hint").textContent = paused ? "PAUSED: nothing will touch the phone." : "Running: commands can control the phone.";
}
async function load_pause() { show_pause((await (await call("/pause")).json()).paused); }

async function start() {
  try {
    const files = await (await call("/files")).json();
    $("file").innerHTML = files.map((f) => `<option>${f}</option>`).join("");
    $("login").style.display = "none"; $("app").hidden = false; $("bar").hidden = false;
    await load_pause();
    await load_file();
  } catch (e) { if (String(e.message) !== "bad token") status("Cannot reach the brain: " + e.message, "err"); }
}

$("go").onclick = () => {
  token = $("token").value.trim();
  try { localStorage.setItem("brain_token", token); } catch {}
  start();
};
$("pause").onclick = async () => {
  const want = !$("pause").dataset.paused;
  $("pause").disabled = true;
  try {
    const res = await call("/pause", { method: "POST", body: JSON.stringify({ paused: want }) });
    show_pause((await res.json()).paused);
    status(want ? "Paused." : "Resumed.", "ok");
  } catch (e) { status("Pause not changed: " + e.message, "err"); }
  $("pause").disabled = false;
};
// ---- Listen: mic -> simple voice-activity cut -> POST each utterance (16 kHz float32) to /listen ----
let mic = null;

function heard(main, meta) {
  const li = document.createElement("li");
  li.textContent = main;
  const m = document.createElement("div"); m.className = "meta"; m.textContent = meta; li.append(m);
  $("heard").prepend(li);
  while ($("heard").children.length > 20) $("heard").lastChild.remove();
}

async function send_clip(frames) {
  const pcm = new Float32Array(frames.reduce((n, f) => n + f.length, 0));
  let at = 0; for (const f of frames) { pcm.set(f, at); at += f.length; }
  try {
    const r = await (await call("/listen", { method: "POST", body: pcm.buffer })).json();
    const did = r.done ? " → " + r.done.join(" | ") : "";
    heard(`"${r.text || "…"}"  ${r.result}${did}`,
      `voice ${r.score} ${r.is_me ? "✓ you" : "✗ not you"} (${r.style}) · ${r.seconds}s audio · ${(r.ms / 1000).toFixed(1)}s`);
  } catch (e) { heard("error: " + e.message, new Date().toLocaleTimeString()); }
}

async function start_listen() {
  if (!window.isSecureContext) throw new Error("mic needs the https://…ts.net address");
  const stream = await navigator.mediaDevices.getUserMedia(
    // Keep echo cancellation (music playing), but no noise suppression / auto gain: they change the
    // voice enough to lower the voiceprint score (live clips scored ~0.55 vs ~0.7 from the recorder).
    { audio: { echoCancellation: true, noiseSuppression: false, autoGainControl: false } });
  const ctx = new AudioContext({ sampleRate: 16000 });
  const node = ctx.createScriptProcessor(1024, 1, 1);  // 64 ms frames
  let noise = 0.003, talking = false, frames = [], pre = [], quiet = 0;
  node.onaudioprocess = (e) => {
    const x = new Float32Array(e.inputBuffer.getChannelData(0));
    let s = 0; for (const v of x) s += v * v;
    // 0.005 floor: without auto gain the mic is quiet, 0.015 missed normal speech.
    const rms = Math.sqrt(s / x.length), loud = rms > Math.max(0.005, noise * 3);
    $("level").style.width = Math.min(100, rms * 1500) + "%";
    $("level").classList.toggle("on", talking);
    if (!talking) {
      noise = 0.95 * noise + 0.05 * rms;
      pre.push(x); if (pre.length > 10) pre.shift();         // keep ~0.6 s before speech starts (the "A" of Apollo)
      if (loud) { talking = true; frames = pre.slice(); quiet = 0; }
    } else {
      frames.push(x); quiet = loud ? 0 : quiet + 1;
      if (quiet > 12 || frames.length > 220) {                // ~0.8 s of silence, or 14 s max
        talking = false; pre = [];
        if (frames.length - quiet > 8) send_clip(frames);     // ignore blips under ~0.5 s
        frames = [];
      }
    }
  };
  ctx.createMediaStreamSource(stream).connect(node); node.connect(ctx.destination);
  let lock = null; try { lock = await navigator.wakeLock.request("screen"); } catch {}
  mic = { stream, ctx, lock };
}

function stop_listen() {
  mic.stream.getTracks().forEach((t) => t.stop()); mic.ctx.close(); mic.lock?.release(); mic = null;
  $("level").style.width = "0";
}

$("listen").onclick = async () => {
  try {
    if (mic) stop_listen(); else await start_listen();
    status(mic ? "Listening. Say \"Apollo, …\"" : "Stopped listening.", "ok");
  } catch (e) { status("Mic: " + e.message, "err"); }
  $("listen").textContent = mic ? "⏹ Stop listening" : "🎙 Start listening";
  $("listen").classList.toggle("on", !!mic);
};
$("text").addEventListener("input", set_dirty);
$("file").onchange = () => {
  if ($("text").value !== loaded && !confirm("Discard unsaved changes?")) return;
  load_file();
};
$("reload").onclick = () => {
  if ($("text").value !== loaded && !confirm("Discard unsaved changes?")) return;
  load_file().catch((e) => status(e.message, "err"));
};
$("save").onclick = async () => {
  $("save").disabled = true; status("Saving…");
  try {
    await call("/file?name=" + encodeURIComponent($("file").value), { method: "PUT", body: $("text").value });
    loaded = $("text").value; set_dirty(); status("Saved. Next command uses it.", "ok");
  } catch (e) { set_dirty(); status("Not saved: " + e.message, "err"); }
};
window.addEventListener("beforeunload", (e) => { if ($("text").value !== loaded) e.preventDefault(); });

token ? start() : show_login();
</script>
</body>
</html>
